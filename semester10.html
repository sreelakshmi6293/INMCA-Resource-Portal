<script>
    const from = new URLSearchParams(window.location.search).get('from');

    // Subject links-il source parameter cherkkunnu
    if (from === 'all' || from === 'student') {
        document.querySelectorAll('a[href^="resources.php"]').forEach(link => {
            const url = new URL(link.href);
            url.searchParams.set('from', from);
            link.href = url.href;
        });
    }

    
    const backTarget = from === 'all'
        ? 'faculty_dashboard.php'
        : 'student-dashboard.html';

    document.getElementById('back-link').href = backTarget;
    document.querySelector('.back-to-dashboard .primary-btn').href = backTarget;
</script>
